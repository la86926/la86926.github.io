<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portfolio ∞</title>
  <meta name="description" content="Experimentos web, herramientas, ideas y pequeños productos reunidos en un universo visual sobrio">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23050506'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23ffffff' stroke-opacity='.35' stroke-width='1.6'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%23c9d4ff' stroke-opacity='.6' stroke-width='1.6'/%3E%3Ccircle cx='32' cy='13' r='3' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #050506;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --faint: rgba(235, 238, 250, .42);
      --line: rgba(222, 230, 255, .11);
      --line-2: rgba(200, 214, 255, .16);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --o: min(86vmin, 820px);
      --gutter: clamp(18px, 4vw, 44px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 55% at 50% 52%, rgba(28, 34, 72, .42), transparent 70%),
        radial-gradient(ellipse 50% 45% at 14% 12%, rgba(52, 30, 92, .22), transparent 72%),
        radial-gradient(ellipse 55% 50% at 88% 92%, rgba(16, 36, 82, .26), transparent 72%),
        var(--bg);
    }

    /* ---------- fondo: rejilla de puntos y estrellas ---------- */
    .grid {
      position: fixed;
      inset: -40px;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .5) .6px, transparent 1.1px);
      background-size: 34px 34px;
      background-position: center;
      opacity: 0;
      -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 0%, rgba(0, 0, 0, .35) 45%, transparent 78%);
      mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 0%, rgba(0, 0, 0, .35) 45%, transparent 78%);
      animation: gridIn 3.2s var(--ease) .2s forwards;
      will-change: transform;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 2.6s var(--ease) .4s forwards;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 55%, rgba(0, 0, 0, .55) 100%);
    }

    /* ---------- encabezado y pie ---------- */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-left: max(var(--gutter), env(safe-area-inset-left));
      padding-right: max(var(--gutter), env(safe-area-inset-right));
      pointer-events: none;
    }

    .top { top: max(22px, env(safe-area-inset-top)); }
    .bottom { bottom: max(22px, env(safe-area-inset-bottom)); }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--text);
      white-space: nowrap;
    }

    .brand .inf {
      display: inline-block;
      font-weight: 600;
      color: #dfe5ff;
      animation: infGlow 6s ease-in-out infinite;
    }

    .tag, .foot {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .01em;
      color: var(--faint);
      white-space: nowrap;
    }

    .reveal {
      opacity: 0;
      transform: translateY(-6px);
      animation: drop 1.4s var(--ease-out) forwards;
    }
    .bottom .reveal { transform: translateY(6px); }

    .scroll {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .scroll .track {
      position: relative;
      width: 1px;
      height: 26px;
      overflow: hidden;
      background: rgba(255, 255, 255, .1);
      border-radius: 1px;
    }

    .scroll .track::after {
      content: "";
      position: absolute;
      left: 0;
      top: -40%;
      width: 1px;
      height: 40%;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, .85));
      animation: scrollLine 2.6s var(--ease) infinite;
    }

    /* ---------- escena central ---------- */
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1400px;
      pointer-events: none;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--o);
      height: var(--o);
      margin: calc(var(--o) / -2) 0 0 calc(var(--o) / -2);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 1px solid var(--line);
      opacity: 0;
    }

    /* arco luminoso que recorre el anillo */
    .ring::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(210, 222, 255, .0) 200deg, rgba(210, 222, 255, .55) 300deg, rgba(255, 255, 255, .9) 330deg, transparent 332deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.4px), #000 calc(100% - 1px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 1.4px), #000 calc(100% - 1px));
      opacity: .5;
    }

    .ring-outer {
      width: var(--o);
      height: var(--o);
      margin: calc(var(--o) / -2) 0 0 calc(var(--o) / -2);
      animation: ringIn 2.4s var(--ease-out) .5s forwards, spin 24s linear infinite;
    }

    .ring-inner {
      --s: calc(var(--o) * .64);
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      border-color: var(--line-2);
      animation: ringIn 2.4s var(--ease-out) .8s forwards, spinRev 19s linear infinite;
    }
    .ring-inner::before { opacity: .35; }

    /* anillo inclinado: da la sensación de profundidad */
    .tilt {
      --s: calc(var(--o) * 1.16);
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      transform: rotateX(74deg) rotateY(-8deg);
      transform-style: preserve-3d;
    }

    .ring-tilt {
      inset: 0;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-color: rgba(222, 230, 255, .07);
      animation: ringInSoft 2.8s var(--ease-out) 1.1s forwards, spin 34s linear infinite;
    }
    .ring-tilt::before { opacity: .28; }

    .ticks {
      --s: calc(var(--o) * .82);
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      border-radius: 50%;
      background: repeating-conic-gradient(rgba(255, 255, 255, .22) 0deg .25deg, transparent .25deg 6deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px), #000 100%, transparent 100%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px), #000 100%, transparent 100%);
      opacity: 0;
      animation: ticksIn 3s var(--ease-out) 1.3s forwards, spin 90s linear infinite;
    }

    /* satélites: puntos de luz que viajan con la órbita */
    .sat {
      position: absolute;
      inset: -1px;
      transform: rotate(var(--a));
    }

    .sat::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--d, 5px);
      height: var(--d, 5px);
      margin: calc(var(--d, 5px) / -2) 0 0 calc(var(--d, 5px) / -2);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px 1px rgba(200, 214, 255, .75), 0 0 18px 4px rgba(150, 170, 255, .22);
      animation: twinkle var(--tw, 3.4s) ease-in-out infinite;
    }

    /* círculo interior que respira y sigue al cursor */
    .core-wrap {
      --s: calc(var(--o) * .34);
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      will-change: transform;
    }

    .core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(214, 224, 255, .14);
      background:
        radial-gradient(circle at 50% 38%, rgba(150, 168, 255, .10), transparent 62%),
        radial-gradient(circle at 50% 50%, rgba(80, 96, 190, .08), transparent 70%);
      box-shadow: inset 0 0 40px rgba(140, 160, 255, .05), 0 0 80px rgba(90, 110, 220, .06);
      opacity: 0;
      animation: coreIn 2.6s var(--ease-out) 1s forwards, breathe 7s ease-in-out 3.6s infinite;
    }

    .wave {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--o) * .34);
      height: calc(var(--o) * .34);
      margin: calc(var(--o) * -.17) 0 0 calc(var(--o) * -.17);
      border-radius: 50%;
      border: 1px solid rgba(220, 230, 255, .35);
      pointer-events: none;
      animation: wave 2.4s var(--ease-out) forwards;
    }

    /* ---------- contenido ---------- */
    .content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 var(--gutter);
      max-width: 100%;
      pointer-events: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 10.6vw, 138px);
      font-weight: 700;
      line-height: .92;
      letter-spacing: -.055em;
    }

    h1 .line {
      display: block;
      padding: 0 .04em .06em;
      background: linear-gradient(180deg, #ffffff 0%, #f4f6fb 38%, #c4cde0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      opacity: 0;
      filter: blur(14px);
      transform: translateY(26px) scale(.985);
      animation: rise 1.9s var(--ease-out) forwards;
    }
    h1 .line:nth-child(1) { animation-delay: .9s; }
    h1 .line:nth-child(2) { animation-delay: 1.15s; }

    .lead {
      margin: clamp(20px, 3.2vh, 30px) 0 0;
      max-width: 34ch;
      font-size: clamp(15px, 1.6vw, 19px);
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: -.005em;
      color: var(--muted);
      opacity: 0;
      filter: blur(8px);
      transform: translateY(14px);
      animation: rise 1.6s var(--ease-out) 1.55s forwards;
    }

    .btn {
      position: relative;
      margin-top: clamp(26px, 4.4vh, 40px);
      padding: 14px 30px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .035);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      color: var(--text);
      font: 500 15px/1 var(--font);
      letter-spacing: -.005em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 1.4s var(--ease-out) 1.9s forwards;
      transition: border-color .5s var(--ease), background-color .5s var(--ease), transform .5s var(--ease), box-shadow .6s var(--ease);
      -webkit-user-select: none;
      user-select: none;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -60%;
      width: 50%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .14), transparent);
      transform: skewX(-18deg);
      animation: sheen 6.5s var(--ease) 3.6s infinite;
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, .34);
      background-color: rgba(255, 255, 255, .07);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .025), 0 10px 40px -18px rgba(150, 170, 255, .45);
    }

    .btn:active { transition-duration: .15s; }

    .btn:focus-visible {
      outline: none;
      border-color: rgba(255, 255, 255, .5);
      box-shadow: 0 0 0 4px rgba(170, 190, 255, .18);
    }

    .ripple {
      position: absolute;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      pointer-events: none;
      animation: ripple .9s var(--ease-out) forwards;
    }

    /* ---------- animaciones ---------- */
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes gridIn { to { opacity: .11; } }
    @keyframes drop { to { opacity: 1; transform: none; } }
    @keyframes rise { to { opacity: 1; filter: blur(0); transform: none; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes ringIn { 0% { opacity: 0; scale: .9; } 100% { opacity: 1; scale: 1; } }
    @keyframes ringInSoft { 0% { opacity: 0; scale: .86; } 100% { opacity: 1; scale: 1; } }
    @keyframes ticksIn { to { opacity: .22; } }
    @keyframes coreIn { 0% { opacity: 0; transform: scale(.7); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.045); opacity: .62; }
    }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes infGlow { 0%, 100% { opacity: .85; } 50% { opacity: 1; text-shadow: 0 0 10px rgba(200, 214, 255, .45); } }
    @keyframes scrollLine { 0% { top: -40%; } 70%, 100% { top: 110%; } }
    @keyframes sheen { 0% { left: -60%; } 22%, 100% { left: 130%; } }
    @keyframes ripple { to { transform: scale(34); opacity: 0; } }
    @keyframes wave {
      0% { transform: scale(1); opacity: .9; }
      100% { transform: scale(3.6); opacity: 0; }
    }

    /* ---------- responsive ---------- */
    @media (max-width: 760px) {
      :root { --o: min(118vmin, 600px); }
      .tag { font-size: 11px; }
    }

    @media (max-width: 420px) {
      :root { --o: min(124vw, 520px); }
      h1 { font-size: clamp(40px, 13.4vw, 60px); }
      .brand { font-size: 12px; }
      .tag, .foot { font-size: 10.5px; }
      .btn { padding: 13px 26px; font-size: 14px; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      :root { --o: min(96vh, 520px); }
      h1 { font-size: clamp(32px, 6.2vw, 64px); }
      .lead { margin-top: 10px; font-size: 13.5px; max-width: 46ch; }
      .btn { margin-top: 16px; }
    }

    @media (hover: none) {
      .btn:hover { border-color: rgba(255, 255, 255, .18); background-color: rgba(255, 255, 255, .035); box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
      .ring, .core, .ticks { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="bar top">
    <span class="brand reveal" style="animation-delay:.3s">PORTFOLIO/<span class="inf">∞</span></span>
    <span class="tag reveal" style="animation-delay:.45s">Independent web collection</span>
  </header>

  <main class="stage">
    <div class="orbit" id="orbit" aria-hidden="true">
      <div class="tilt">
        <div class="ring ring-tilt">
          <span class="sat" style="--a:120deg;--d:4px;--tw:4.2s"></span>
        </div>
      </div>
      <div class="ticks"></div>
      <div class="ring ring-outer">
        <span class="sat" style="--a:28deg;--d:5px"></span>
        <span class="sat" style="--a:212deg;--d:3px;--tw:5s"></span>
      </div>
      <div class="ring ring-inner">
        <span class="sat" style="--a:300deg;--d:4px;--tw:3.8s"></span>
      </div>
      <div class="core-wrap" id="core">
        <div class="core"></div>
      </div>
    </div>

    <section class="content">
      <h1>
        <span class="line">Built to feel</span>
        <span class="line">impossible</span>
      </h1>
      <p class="lead">Experimentos web, herramientas, ideas y pequeños productos reunidos en un universo visual sobrio.</p>
      <button class="btn" id="btn" type="button">No anto, no</button>
    </section>
  </main>

  <div class="vignette" aria-hidden="true"></div>

  <footer class="bar bottom">
    <span class="foot reveal" style="animation-delay:2.3s">Digital archive</span>
    <span class="foot scroll reveal" style="animation-delay:2.45s">Scroll to discover <span class="track"></span></span>
  </footer>

  <script>
  (function () {
    'use strict';

    /* ---------- sin zoom: se siente como una app ---------- */
    var stop = function (e) { if (e.cancelable) e.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, stop, { passive: false });
    });
    document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) stop(e); }, { passive: false });
    var lastTouch = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouch < 320 && e.target.id !== 'btn') stop(e);
      lastTouch = now;
    }, { passive: false });
    window.addEventListener('wheel', function (e) { if (e.ctrlKey || e.metaKey) stop(e); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].indexOf(e.key) >= 0) stop(e);
    });

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var orbit = document.getElementById('orbit');
    var core = document.getElementById('core');
    var grid = document.getElementById('grid');
    var cv = document.getElementById('stars');
    var cx = cv.getContext('2d');
    var TAU = Math.PI * 2;
    var W = 0, H = 0, DPR = 1, stars = [], meteors = [];

    /* ---------- estrellas dispersas, pocas y discretas ---------- */
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function build() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth;
      H = window.innerHeight;
      cv.width = Math.round(W * DPR);
      cv.height = Math.round(H * DPR);
      cx.setTransform(DPR, 0, 0, DPR, 0, 0);
      var n = Math.min(110, Math.round((W * H) / 12000));
      stars = [];
      for (var i = 0; i < n; i++) {
        var x = Math.random() * W, y = Math.random() * H;
        var dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
        var edge = Math.min(1, Math.sqrt(dx * dx + dy * dy));
        stars.push({
          x: x, y: y,
          r: Math.random() < .92 ? rnd(.3, .8) : rnd(.8, 1.25),
          a: rnd(.18, .55) * (1 - edge * .55),
          z: rnd(.2, 1),
          p: Math.random() * TAU,
          v: rnd(.25, .8),
          blue: Math.random() < .25
        });
      }
    }

    /* ---------- paralaje con el cursor ---------- */
    var target = { x: 0, y: 0 }, pos = { x: 0, y: 0 };

    function point(clientX, clientY) {
      target.x = Math.max(-1, Math.min(1, (clientX / W) * 2 - 1));
      target.y = Math.max(-1, Math.min(1, (clientY / H) * 2 - 1));
    }
    window.addEventListener('pointermove', function (e) { point(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('pointerleave', function () { target.x = 0; target.y = 0; });
    window.addEventListener('blur', function () { target.x = 0; target.y = 0; });

    function draw(t) {
      cx.clearRect(0, 0, W, H);
      var ox = -pos.x * 10, oy = -pos.y * 10;
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = reduced ? 1 : .55 + .45 * Math.sin(t * .001 * s.v + s.p);
        cx.fillStyle = s.blue
          ? 'rgba(200, 214, 255,' + (s.a * tw).toFixed(3) + ')'
          : 'rgba(255, 255, 255,' + (s.a * tw).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(s.x + ox * s.z, s.y + oy * s.z, s.r, 0, TAU);
        cx.fill();
      }
      for (var m = meteors.length - 1; m >= 0; m--) {
        var M = meteors[m];
        M.x += M.vx; M.y += M.vy; M.life -= .014;
        if (M.life <= 0) { meteors.splice(m, 1); continue; }
        var g = cx.createLinearGradient(M.x, M.y, M.x - M.vx * 14, M.y - M.vy * 14);
        g.addColorStop(0, 'rgba(235, 240, 255,' + (M.life * .55).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(235, 240, 255, 0)');
        cx.strokeStyle = g;
        cx.lineWidth = .8;
        cx.beginPath();
        cx.moveTo(M.x, M.y);
        cx.lineTo(M.x - M.vx * 14, M.y - M.vy * 14);
        cx.stroke();
      }
    }

    var running = true, nextMeteor = 0;
    function loop(t) {
      if (!running) return;
      pos.x += (target.x - pos.x) * .055;
      pos.y += (target.y - pos.y) * .055;
      var k = Math.min(W, H) / 900;
      core.style.transform = 'translate3d(' + (pos.x * 26 * k).toFixed(2) + 'px,' + (pos.y * 26 * k).toFixed(2) + 'px,0)';
      orbit.style.transform = 'translate3d(' + (-pos.x * 9 * k).toFixed(2) + 'px,' + (-pos.y * 9 * k).toFixed(2) + 'px,0) rotateX(' + (-pos.y * 4).toFixed(2) + 'deg) rotateY(' + (pos.x * 4).toFixed(2) + 'deg)';
      grid.style.transform = 'translate3d(' + (-pos.x * 6).toFixed(2) + 'px,' + (-pos.y * 6).toFixed(2) + 'px,0)';
      if (!reduced && t > nextMeteor) {
        var ang = rnd(.18, .42) * Math.PI;
        var dir = Math.random() < .5 ? 1 : -1;
        meteors.push({ x: rnd(W * .15, W * .85), y: rnd(0, H * .35), vx: Math.cos(ang) * 4.2 * dir, vy: Math.sin(ang) * 4.2, life: 1 });
        nextMeteor = t + rnd(11000, 19000);
      }
      draw(t);
      requestAnimationFrame(loop);
    }

    document.addEventListener('visibilitychange', function () {
      running = !document.hidden;
      if (running) requestAnimationFrame(loop);
    });

    /* ---------- pulso elegante desde el núcleo ---------- */
    var lastWave = 0;
    function pulse() {
      var now = performance.now();
      if (now - lastWave < 700) return;
      lastWave = now;
      var w = document.createElement('span');
      w.className = 'wave';
      orbit.appendChild(w);
      setTimeout(function () { w.remove(); }, 2500);
    }

    var btn = document.getElementById('btn');
    btn.addEventListener('pointerdown', function (e) {
      var r = btn.getBoundingClientRect();
      var rp = document.createElement('span');
      rp.className = 'ripple';
      rp.style.left = (e.clientX - r.left) + 'px';
      rp.style.top = (e.clientY - r.top) + 'px';
      btn.appendChild(rp);
      setTimeout(function () { rp.remove(); }, 950);
    });
    btn.addEventListener('click', pulse);

    window.addEventListener('wheel', function (e) { if (!e.ctrlKey && Math.abs(e.deltaY) > 8) pulse(); }, { passive: true });
    var sy = null;
    window.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (sy == null) return;
      var dy = sy - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 40) pulse();
      sy = null;
    }, { passive: true });

    var resizeT = 0;
    window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(build, 120); });

    build();
    nextMeteor = performance.now() + 6000;
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
